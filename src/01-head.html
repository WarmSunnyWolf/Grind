<title>Grind</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Grind is a calm study companion for FWS310. Focus with a pond animal, split rocks into pebbles, and study alongside friends.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&family=Nanum+Pen+Script&display=swap">
<style>
/* Layout: a field-journal desk. Pinned left spine of navigation, a wide pond "stage" per view,
   with paper cards beside it. On phones the spine becomes a bottom tab bar. */
:root{
  --bg:#efe6d5; --bg-2:#e6dac4; --surface:#f8f2e7; --surface-2:#eee4d2; --line:#d6c7ab; --line-2:#c4b291;
  --ink:#22352a; --ink-2:#4b5a4a; --muted:#7a7d69;
  --accent:#2f5a3f; --accent-ink:#f8f2e7; --moss:#7f8f55; --rose:#b07a6e; --rose-soft:#ecd5cc; --gold:#c39a43;
  --sky:#eadfc8; --water:#a2baa6; --water-2:#86a48f; --water-hi:#cbdbc8; --pad:#6f8f4e; --pad-2:#57763d;
  --bank:#cdb995; --reed:#5d6d3c; --bloom:#e9bcb3; --glow:#f4e3a3; --shadow:rgba(52,40,24,.14);
  --f-display:"Young Serif", "Iowan Old Style", Georgia, serif;
  --f-body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --f-hand:"Nanum Pen Script", "Comic Sans MS", cursive;
  --r-s:10px; --r-m:16px; --r-l:26px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#131b16; --bg-2:#18221c; --surface:#1d2922; --surface-2:#24332a; --line:#32443a; --line-2:#435a4c;
  --ink:#ede4d1; --ink-2:#c3bca8; --muted:#8f9481;
  --accent:#a9c48b; --accent-ink:#14201a; --moss:#93a468; --rose:#d29b8e; --rose-soft:#47312d; --gold:#d9b65f;
  --sky:#17241e; --water:#2a463b; --water-2:#20392f; --water-hi:#3e5f51; --pad:#4d6e3b; --pad-2:#3b5631;
  --bank:#29352a; --reed:#3d4c31; --bloom:#d7a3a0; --glow:#f3e49c; --shadow:rgba(0,0,0,.35);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#131b16; --bg-2:#18221c; --surface:#1d2922; --surface-2:#24332a; --line:#32443a; --line-2:#435a4c;
  --ink:#ede4d1; --ink-2:#c3bca8; --muted:#8f9481;
  --accent:#a9c48b; --accent-ink:#14201a; --moss:#93a468; --rose:#d29b8e; --rose-soft:#47312d; --gold:#d9b65f;
  --sky:#17241e; --water:#2a463b; --water-2:#20392f; --water-hi:#3e5f51; --pad:#4d6e3b; --pad-2:#3b5631;
  --bank:#29352a; --reed:#3d4c31; --bloom:#d7a3a0; --glow:#f3e49c; --shadow:rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{min-height:100%}
body{background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(circle at 12% 0%, color-mix(in srgb, var(--moss) 10%, transparent) 0, transparent 40%),
                   radial-gradient(circle at 100% 100%, color-mix(in srgb, var(--rose) 10%, transparent) 0, transparent 45%);
  min-height:100vh;}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:50; background:var(--bg)}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--rose); outline-offset:2px; border-radius:8px}
h1,h2,h3,h4{font-family:var(--f-display); font-weight:400; margin:0; text-wrap:balance; letter-spacing:-.005em}
h1{font-size:clamp(1.6rem,1.2rem + 1.4vw,2.3rem); line-height:1.1}
h2{font-size:1.35rem; line-height:1.2}
h3{font-size:1.08rem; line-height:1.25}
p{margin:0}
.hand{font-family:var(--f-hand); font-size:1.35em; line-height:1; letter-spacing:.01em}
.eyebrow{font-size:.72rem; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:600}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute!important; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

/* ---------- shell ---------- */
.app{display:grid; grid-template-columns:236px minmax(0,1fr); min-height:100%}
.side{position:sticky; top:env(safe-area-inset-top,0px); height:calc(100vh - env(safe-area-inset-top,0px)); display:flex; flex-direction:column; gap:22px;
  padding:26px 16px 20px max(16px, env(safe-area-inset-left,0px)); border-right:1px solid var(--line); background:color-mix(in srgb, var(--surface) 55%, transparent)}
.brand{display:flex; align-items:center; gap:10px; padding:0 8px; text-decoration:none; color:var(--ink)}
.brand svg{width:40px; height:40px; flex:none}
.brand b{font-family:var(--f-display); font-weight:400; font-size:1.7rem; line-height:1}
.brand small{display:block; font-size:.68rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin-top:3px}
.nav{display:flex; flex-direction:column; gap:3px}
.nav button{display:flex; align-items:center; gap:12px; border:0; background:none; padding:10px 12px; border-radius:12px; color:var(--ink-2); font-weight:500; text-align:left; position:relative}
.nav button svg{width:21px; height:21px; flex:none}
.nav button:hover{background:var(--surface-2); color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent); color:var(--accent-ink)}
.nav .dot{position:absolute; right:12px; width:8px; height:8px; border-radius:50%; background:var(--rose)}
.side-foot{margin-top:auto; display:flex; flex-direction:column; gap:10px}
.me-mini{display:flex; align-items:center; gap:10px; padding:8px; border-radius:14px; border:1px solid var(--line); background:var(--surface); text-align:left; width:100%}
.me-mini .av{width:40px; height:40px; border-radius:50%; background:var(--water-hi); flex:none; overflow:hidden}
.me-mini .av svg{width:100%; height:100%}
.me-mini b{display:block; font-weight:600; font-size:.92rem; line-height:1.2}
.me-mini span{font-size:.78rem; color:var(--muted)}
.ghost-btn{display:flex; align-items:center; gap:10px; border:0; background:none; color:var(--ink-2); padding:8px 12px; border-radius:10px; font-weight:500}
.ghost-btn:hover{background:var(--surface-2)}
.ghost-btn svg{width:19px; height:19px}

.main{min-width:0; padding-block:22px 60px; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px))}
.main-in{max-width:1180px; margin:0 auto; display:flex; flex-direction:column; gap:22px; padding-inline:clamp(0px,2vw,18px)}
.top{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap}
.top .greet .hand{color:var(--rose); font-size:1.6rem; display:block; margin-bottom:2px}
.chips{display:flex; gap:8px; flex-wrap:wrap}
.chip{display:inline-flex; align-items:center; gap:7px; padding:7px 12px 7px 9px; border-radius:999px; background:var(--surface); border:1px solid var(--line); font-weight:600; font-size:.88rem; white-space:nowrap}
.chip svg{width:20px; height:20px}
.chip.sync{font-weight:500; color:var(--muted)}
.chip.sync i{width:8px; height:8px; border-radius:50%; background:var(--muted); display:inline-block}
.chip.sync.on i{background:var(--moss); box-shadow:0 0 0 3px color-mix(in srgb,var(--moss) 25%,transparent)}
.chip.demo{background:var(--rose); color:#fff; border-color:transparent}

.view{display:none; flex-direction:column; gap:22px; animation:viewin .35s ease}
.view.on{display:flex}
@keyframes viewin{from{transform:translateY(6px)}to{transform:none}}

/* ---------- cards & controls ---------- */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-l); padding:20px; min-width:0}
.card.flat{background:transparent; border-style:dashed}
.card-h{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:14px; flex-wrap:wrap}
.grid{display:grid; gap:18px}
.g-focus{grid-template-columns:minmax(0,1.65fr) minmax(280px,1fr)}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.stack{display:flex; flex-direction:column; gap:18px; min-width:0}
.row{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border:1px solid var(--line-2); background:var(--surface); color:var(--ink); padding:9px 16px; border-radius:999px; font-weight:600; font-size:.92rem; transition:transform .12s, background .15s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn svg{width:18px; height:18px}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn.primary:hover{background:color-mix(in srgb, var(--accent) 88%, var(--ink))}
.btn.rose{background:var(--rose); border-color:var(--rose); color:#fff}
.btn.big{padding:13px 26px; font-size:1.02rem}
.btn.small{padding:6px 12px; font-size:.84rem}
.btn.quiet{border-color:transparent; background:transparent}
.btn.quiet:hover{background:var(--surface-2)}
.btn[disabled]{opacity:.45; cursor:not-allowed}
.icon-btn{width:36px; height:36px; display:inline-grid; place-items:center; border-radius:50%; border:1px solid var(--line); background:var(--surface); color:var(--ink-2)}
.icon-btn:hover{background:var(--surface-2); color:var(--ink)}
.icon-btn svg{width:18px; height:18px}
label.f{display:flex; flex-direction:column; gap:6px; font-size:.82rem; font-weight:600; color:var(--ink-2); min-width:0}
.inp, select.inp, textarea.inp{width:100%; border:1px solid var(--line-2); background:var(--bg); border-radius:12px; padding:9px 12px; font-size:.95rem; font-weight:400; color:var(--ink)}
textarea.inp{resize:vertical; min-height:84px}
.inp:focus{outline:2px solid var(--moss); outline-offset:0; border-color:transparent}
.seg{display:inline-flex; padding:4px; border-radius:999px; background:var(--surface-2); border:1px solid var(--line); gap:2px; flex-wrap:wrap}
.seg button{border:0; background:none; padding:7px 14px; border-radius:999px; font-weight:600; font-size:.86rem; color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:0 1px 3px var(--shadow)}
.pill{display:inline-flex; align-items:center; gap:6px; font-size:.75rem; font-weight:600; padding:3px 9px; border-radius:999px; background:var(--surface-2); color:var(--ink-2); white-space:nowrap}
.pill i{width:8px; height:8px; border-radius:50%; display:inline-block}
.pill.example{background:transparent; border:1px dashed var(--line-2); color:var(--muted)}
.empty{padding:22px; text-align:center; color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:8px}
.empty .hand{color:var(--ink-2)}
input[type=range]{accent-color:var(--accent); width:100%}

/* ---------- pond stage ---------- */
.stage{position:relative; border-radius:var(--r-l); overflow:hidden; border:1px solid var(--line); background:var(--sky); isolation:isolate}
.stage > svg.scene{display:block; width:100%; height:auto}
.stage canvas.fx{position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:3}
.stage .over{position:absolute; inset:0; z-index:4; pointer-events:none}
.stage .over > *{pointer-events:auto}

.stage .stars, .stage .moon{display:none}
.stage[data-sky="night"] .stars, .stage[data-sky="night"] .moon{display:inline}
.stage[data-sky="night"] .sun{display:none}
.stage[data-sky="night"] .tint{opacity:.34}
.stage[data-sky="dusk"] .tint{fill:#b5624c; opacity:.14}
.stage[data-sky="night"] .timer-ov, .stage[data-sky="night"] .pet-tag{color:#f4ecda}
.stage[data-sky="night"] .timer-ov .sub, .stage[data-sky="night"] .pet-tag span{color:#ddd3bf}
.stage[data-sky="night"] .timer-ov .phase{color:#f1c6b8}
.stage[data-sky="night"] .prog{background:rgba(255,255,255,.18)}
.stage[data-sky="dusk"] .sun{fill:#f0b27a}
.focus-stage{aspect-ratio:16/10; max-width:100%}
.focus-stage > svg.scene{position:absolute; inset:0; height:100%; width:100%}
.hero-pet{position:absolute; left:50%; top:58%; width:34%; max-width:300px; transform:translate(-50%,-50%); z-index:2; transition:filter .6s}
.hero-pet > svg{width:100%; height:auto; display:block; overflow:visible}
.hero-pet.focus::before{content:""; position:absolute; inset:8% 4% 2%; border-radius:50%; background:radial-gradient(closest-side, color-mix(in srgb,var(--glow) 55%,transparent), transparent); z-index:-1; animation:aura 3.2s ease-in-out infinite}
@keyframes aura{50%{transform:scale(1.08); opacity:.7}}
.timer-ov{position:absolute; left:clamp(14px,3vw,28px); top:clamp(12px,3vw,24px); z-index:5; display:flex; flex-direction:column; gap:2px; color:var(--ink)}
.timer-ov .phase{font-family:var(--f-hand); font-size:1.6rem; color:var(--rose); line-height:1}
.timer-ov .clock{font-family:var(--f-display); font-size:clamp(2.6rem,1.6rem + 4vw,4.8rem); line-height:1; font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.timer-ov .sub{font-size:.86rem; color:var(--ink-2); font-weight:500; max-width:28ch}
.pet-tag{position:absolute; right:clamp(14px,3vw,24px); top:clamp(12px,3vw,22px); z-index:5; text-align:right}
.pet-tag b{font-family:var(--f-display); font-weight:400; font-size:1.25rem; display:block}
.pet-tag span{font-size:.8rem; color:var(--ink-2)}
.prog{position:absolute; left:6%; right:6%; bottom:6%; height:6px; border-radius:6px; background:color-mix(in srgb, var(--ink) 12%, transparent); z-index:5; overflow:visible}
.prog i{position:absolute; left:0; top:0; bottom:0; border-radius:6px; background:var(--accent); width:0}
.prog b{position:absolute; top:50%; width:16px; height:16px; border-radius:50%; background:var(--surface); border:3px solid var(--accent); transform:translate(-50%,-50%); left:0}
.speech{position:absolute; left:68%; top:30%; transform:translateX(-50%); z-index:6; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:8px 14px; font-family:var(--f-hand); font-size:1.45rem; line-height:1.1; max-width:80%; text-align:center; box-shadow:0 6px 18px var(--shadow); opacity:0; transition:opacity .35s, transform .35s; pointer-events:none}
.speech.show{opacity:1; transform:translate(-50%,-4px)}

.controls{display:flex; flex-direction:column; gap:16px}
.dur-row{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px}
.dur{display:flex; flex-direction:column; gap:8px}
.dur-top{display:flex; justify-content:space-between; align-items:baseline}
.dur-top b{font-family:var(--f-display); font-weight:400; font-size:1.5rem}
.dur-top b small{font-family:var(--f-body); font-size:.8rem; color:var(--muted); margin-left:3px}
.stepper{display:flex; gap:6px; align-items:center}
.stepper input[type=number]{width:64px; text-align:center}

/* next pebble */
.next-peb{display:flex; gap:14px; align-items:flex-start}
.peb-shape{flex:none; width:44px; height:34px}
.next-peb h3{margin-bottom:4px}
.done-list{display:flex; flex-direction:column; gap:2px; list-style:none; margin:0; padding:0}
.done-list li{display:flex; align-items:center; gap:10px; padding:8px 2px; border-bottom:1px dashed var(--line); font-size:.9rem}
.done-list li:last-child{border-bottom:0}
.done-list svg{width:18px; height:18px; flex:none; color:var(--moss)}
.done-list .t{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.mini-stats{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px}
.mini-stats div{background:var(--surface-2); border-radius:14px; padding:10px 12px}
.mini-stats b{font-family:var(--f-display); font-weight:400; font-size:1.5rem; display:block; line-height:1.1}
.mini-stats span{font-size:.75rem; color:var(--muted); font-weight:600}

/* ---------- pebbles ---------- */
.rock-list{display:flex; flex-direction:column; gap:16px}
.rock{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-l); overflow:hidden}
.rock-head{display:flex; gap:14px; align-items:center; padding:16px 18px; cursor:pointer}
.rock-head .rk{width:52px; height:42px; flex:none}
.rock-head .meta{flex:1; min-width:0}
.rock-head h3{overflow-wrap:anywhere}
.rock-head .sub{display:flex; gap:8px; flex-wrap:wrap; margin-top:5px; align-items:center}
.rock-body{padding:0 18px 18px; display:flex; flex-direction:column; gap:14px}
.crossing{border-radius:18px; overflow:hidden; border:1px solid var(--line)}
.crossing > svg{display:block; width:100%; height:auto}
.peb-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px}
.peb{display:flex; gap:12px; align-items:center; padding:8px 10px; border-radius:12px; background:var(--bg)}
.peb.done .tx{text-decoration:line-through; text-decoration-color:var(--moss); color:var(--muted)}
.peb .tx{flex:1; min-width:0; overflow-wrap:anywhere}
.peb .mins{font-size:.78rem; color:var(--muted); white-space:nowrap}
.chk{width:26px; height:26px; flex:none; border-radius:50% 46% 52% 48%; border:2px solid var(--line-2); background:var(--surface); display:grid; place-items:center; padding:0}
.chk svg{width:16px; height:16px; opacity:0; color:var(--accent-ink)}
.peb.done .chk{background:var(--moss); border-color:var(--moss)}
.peb.done .chk svg{opacity:1}
.add-peb{display:flex; gap:8px}
.add-peb .inp{flex:1}
.ai-box{border:1px dashed var(--line-2); border-radius:16px; padding:14px; display:flex; flex-direction:column; gap:10px; background:color-mix(in srgb, var(--water-hi) 30%, transparent)}
.ai-box ol{margin:0; padding-left:20px; display:flex; flex-direction:column; gap:4px}
.due{font-size:.78rem; font-weight:600; color:var(--ink-2)}
.prog-bar{height:6px; border-radius:6px; background:var(--surface-2); overflow:hidden; width:100%; max-width:220px}
.prog-bar i{display:block; height:100%; background:var(--moss); border-radius:6px}

/* ---------- community pond ---------- */
.pond-stage{aspect-ratio:16/9}
.pond-stage > svg.scene{position:absolute; inset:0; width:100%; height:100%}
.resident{position:absolute; width:clamp(64px,11%,118px); transform:translate(-50%,-62%); border:0; background:none; padding:0; display:flex; flex-direction:column; align-items:center; gap:2px; z-index:4}
.resident > svg{width:100%; height:auto; overflow:visible; display:block}
.resident .plate{font-size:.72rem; font-weight:700; background:var(--surface); border:1px solid var(--line); padding:2px 8px; border-radius:999px; white-space:nowrap; max-width:140px; overflow:hidden; text-overflow:ellipsis; box-shadow:0 2px 6px var(--shadow)}
.resident .plate.focus{background:var(--accent); color:var(--accent-ink); border-color:transparent}
.resident.me .plate{outline:2px solid var(--rose); outline-offset:1px}
.resident:hover > svg{transform:translateY(-3px)}
.resident > svg{transition:transform .2s}
.ripple-ring{position:absolute; width:20px; height:10px; border:2.5px solid color-mix(in srgb,var(--surface) 85%,transparent); border-radius:50%; transform:translate(-50%,-50%); z-index:3; pointer-events:none; animation:ripple 1.8s ease-out forwards}
@keyframes ripple{to{width:260px; height:90px; opacity:0; border-width:1px}}
.pop{position:absolute; z-index:20; width:min(300px,86vw); background:var(--surface); border:1px solid var(--line); border-radius:20px; box-shadow:0 14px 40px var(--shadow); padding:16px; display:flex; flex-direction:column; gap:10px}
.pop .ph{display:flex; gap:12px; align-items:center}
.pop .ph .av{width:56px; height:56px; border-radius:50%; background:var(--water-hi); flex:none; overflow:hidden}
.pop .ph .av svg{width:100%; height:100%}
.pop .msgs{display:flex; flex-wrap:wrap; gap:6px}
.legend{display:flex; gap:14px; flex-wrap:wrap; font-size:.82rem; color:var(--ink-2)}
.legend span{display:inline-flex; gap:6px; align-items:center}
.legend i{width:10px; height:10px; border-radius:50%; display:inline-block}
.ripple-feed{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px}
.ripple-feed li{display:flex; gap:10px; align-items:center; font-size:.9rem}
.ripple-feed .av{width:34px; height:34px; border-radius:50%; background:var(--water-hi); flex:none; overflow:hidden}
.ripple-feed .av svg{width:100%; height:100%}
.ripple-feed q{font-family:var(--f-hand); font-size:1.3rem; quotes:none}
.ripple-feed small{color:var(--muted); display:block; font-size:.75rem}

/* ---------- together ---------- */
.lotus-wrap{display:grid; grid-template-columns:minmax(220px,320px) minmax(0,1fr); gap:20px; align-items:center}
.lotus-wrap svg{width:100%; height:auto}
.member-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px}
.member-list li{display:flex; gap:12px; align-items:center; padding:8px 10px; border-radius:14px; background:var(--bg)}
.member-list .av{width:38px; height:38px; border-radius:50%; background:var(--water-hi); flex:none; overflow:hidden}
.member-list .av svg{width:100%; height:100%}
